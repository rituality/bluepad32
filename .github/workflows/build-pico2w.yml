
name: Build Bluepad32 for Pico 2 W

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/pico_w/**'
      - 'src/**'
      - 'external/btstack/**'
      - '.github/workflows/build-pico2w.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Pico 2 W firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Bluepad32
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply Bluepad32 BTstack patches
        run: |
          cd external/btstack
          git apply ../patches/*.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3

      - name: Download Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.0 \
            https://github.com/raspberrypi/pico-sdk.git \
            "$RUNNER_TEMP/pico-sdk"

          cd "$RUNNER_TEMP/pico-sdk"
          git submodule update --init --recursive

      - name: Configure
        run: |
          test -f external/btstack/src/hids_host.c

          cmake -S examples/pico_w -B build \
            -G Ninja \
            -DPICO_BOARD=pico2_w \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
            -DBTSTACK_ROOT="$GITHUB_WORKSPACE/external/btstack" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: |
          cmake --build build --parallel 2

      - name: Verify firmware
        run: |
          ls -lh build/bluepad32_picow_example_app.uf2
          test -s build/bluepad32_picow_example_app.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v5
        with:
          name: Bluepad32-Pico2W
          path: build/bluepad32_picow_example_app.uf2
          if-no-files-found: error
          retention-days: 30
